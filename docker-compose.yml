services:
  postgres:
    image: postgres:16
    container_name: ecommerce-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  java:
    build:
      context: ./java-service
    container_name: ecommerce-agent-java
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PYTHON_AGENT_BASE_URL: http://python:8000
      # 订单数据来源：mock=本地模拟造数（默认）；real=拉取平台真实订单。
      # 切 real 前先在「设置中心 → 平台对接」填好各平台凭证。
      DATA_SOURCE: ${DATA_SOURCE:-mock}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  python:
    build:
      context: ./python-agent-service
    container_name: ecommerce-agent-python
    restart: unless-stopped
    # 面向最终用户发布：LLM 由「设置中心」页面配置驱动（LLM_ENABLED=true），
    # 用户未填 Key 时自动降级规则模式；本地 RAG 默认关闭（需本地嵌入模型，按需开启）。
    environment:
      LLM_ENABLED: "true"
      RAG_ENABLED: "false"
      JAVA_API_BASE_URL: http://java:8080
      ORDER_MONITOR_MODE: "demo"
      ORDER_MONITOR_DEMO_SUCCESS_RATE: "0.5"
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
    depends_on:
      java:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    container_name: ecommerce-agent-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - java
      - python
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ -O /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  backend:

volumes:
  postgres_data:
