[project]
name = "ecommerce-agent-service"
version = "0.1.0"
description = "Python multi-agent service for the ecommerce super individual assistant."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.116.0",
    "httpx>=0.28.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-chroma>=0.1.3",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "loguru>=0.7.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
