spring:
  application:
    name: ecommerce-agent-java-service
  datasource:
    # 本地开发明确连接 Docker PostgreSQL，避免 localhost 在 Windows 上解析到另一套本机数据库。
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/ecommerce_agent}
    username: ${POSTGRES_USER:ecommerce}
    password: ${POSTGRES_PASSWORD:ecommerce_password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  error:
    # 4xx 业务异常（如平台未对接、凭证缺失）需要把中文原因带到前端弹窗，不能只给状态码。
    include-message: always

springdoc:
  swagger-ui:
    path: /docs
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}

# 订单数据来源：mock=本地模拟造数（默认，演示/试用）；real=经 Python 适配器拉取平台真实订单。
# 切到 real 前需在「设置中心 → 平台对接」填好各平台凭证。
platform:
  data-source: ${DATA_SOURCE:mock}

# 地址补全定时轮询（模式无关，走 PlatformAdapter：模拟器即官方 API 替身）。
# 自动回写平台 address_complete 真相，免去运营逐单手动点「确认地址已补全」。
order:
  address-sync:
    enabled: ${ORDER_ADDRESS_SYNC_ENABLED:true}
    fixed-delay-ms: ${ORDER_ADDRESS_SYNC_DELAY_MS:60000}
    batch-size: ${ORDER_ADDRESS_SYNC_BATCH:50}
    # 地址未补全订单超过该天数仍未处理 → 自动升级为「需人工审核」（模拟器下也生效，便于演练）。
    sla-days: ${ORDER_ADDRESS_SYNC_SLA_DAYS:7}

python:
  agent:
    base-url: ${PYTHON_AGENT_BASE_URL:http://localhost:8000}
    connect-timeout-ms: 10000
    read-timeout-ms: 120000

# 鉴权配置
jwt:
  # 与 Python 服务共用同一密钥（来自 .env 的 JWT_SECRET），HS256 签发/校验
  secret: ${JWT_SECRET:dev-jwt-secret-change-me}
  expiration-ms: 86400000
tenant:
  credential-encryption-key: ${PLATFORM_CREDENTIAL_ENCRYPTION_KEY:dev-platform-credential-key-change-me}
# 服务间调用密钥（Python <-> Java 双向闭环的写回/编排调用使用 X-Service-Key 头）
service:
  api-key: ${SERVICE_API_KEY:dev-service-key-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized
