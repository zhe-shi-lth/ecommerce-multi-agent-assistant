spring:
  application:
    name: ecommerce-agent-java-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_agent}
    username: ${POSTGRES_USER:ecommerce}
    password: ${POSTGRES_PASSWORD:ecommerce_password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

springdoc:
  swagger-ui:
    path: /docs

python:
  agent:
    base-url: ${PYTHON_AGENT_BASE_URL:http://localhost:8000}
    connect-timeout-ms: 10000
    read-timeout-ms: 120000
